name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── HARD-LOCK GATE ──────────────────────────────────────────────────────
  # This job MUST stay green on every PR. It runs only the security tests
  # in internal/foundry — any breakage here blocks merge.
  hard-lock:
    name: hard-lock test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: core/go.sum
      - name: Run lock tests
        working-directory: core
        run: go test -race -v ./internal/foundry/...

  # ── Go core build + test (matrix) ───────────────────────────────────────
  go-core:
    name: go core / ${{ matrix.os }}
    needs: hard-lock
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: core/go.sum
      - name: go vet
        working-directory: core
        run: go vet ./...
      - name: go test
        working-directory: core
        run: go test -race ./...
      - name: build binaries
        working-directory: core
        run: |
          go build ./cmd/sidecar
          go build ./cmd/harness

  # ── TS extension build ──────────────────────────────────────────────────
  extension:
    name: vscode extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json
      - name: npm ci
        working-directory: extension
        run: npm ci || npm install
      - name: tsc
        working-directory: extension
        run: npm run build --if-present
